        :root {
            --primary-color: #2b6cb0;

            --error-color: #f56565;
            --text-color: #2d3748;

        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: #f7fafc;
            margin: 0;
            padding: 20px;
        }

            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 15px;
        }

        .segment {
            margin-bottom: 40px;
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .segment-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            margin: 0;
            font-size: 1.25rem;
        }

        .question-container {
            padding: 20px;
            border-bottom: 1px solid #edf2f7;
            background-color: #fff;
        }

        .question-container:last-child {
            border-bottom: none;
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 12px;
        }

        .options-route {
            display: grid;
            gap: 10px;
            margin-left: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .option-label:hover {
            background-color: #edf2f7;
        }

        .option-label input {
            margin-right: 12px;
        }

        .fill-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .initial-letter {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .fill-input {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            width: 200px;
            transition: border-color 0.2s;
        }

        .fill-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #2b6cb0;
        }

        #results-panel {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background-color: #ebf8ff;
            border: 2px solid #bee3f8;
            border-radius: var(--border-radius);
            text-align: center;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px 0;
        }

        .correct-answer {
            background-color: #f0fff4 !important;
            border-color: var(--success-color) !important;
        }

        .incorrect-answer {
            background-color: #fff5f5 !important;
            border-color: var(--error-color) !important;
        }

        .feedback-text {
            font-size: 0.9rem;
            margin-top: 6px;
            font-weight: bold;
        }
        
        .feedback-success { color: var(--success-color); }
        .feedback-error { color: var(--error-color); }
    </style>
</head>

    function initQuiz() {
        const formContainer = document.getElementById('quiz-form');
        quizData.forEach(seg => {
            const segDiv = document.createElement('div');
            segDiv.className = 'segment';
            
            const header = document.createElement('h3');
            header.className = 'segment-header';
            header.innerText = seg.title;
            segDiv.appendChild(header);

            seg.questions.forEach((q, idx) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-container';
                qDiv.id = `q-container-${q.id}`;

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = `${idx + 1}. ${q.q}`;
                qDiv.appendChild(qText);

                if (q.type === 'mcq') {
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'options-route';
                    q.options.forEach(opt => {
                        const label = document.createElement('label');
                        label.className = 'option-label';
                        
                        const input = document.createElement('input');
                        input.type = 'radio';
                        input.name = `question-${q.id}`;
                        input.value = opt;
                        
                        label.appendChild(input);
                        label.appendChild(document.createTextNode(opt));
                        optionsDiv.appendChild(label);
                    });
                    qDiv.appendChild(optionsDiv);
                } else if (q.type === 'fill') {
                    const fillWrapper = document.createElement('div');
                    fillWrapper.className = 'fill-input-wrapper';
                    
                    const initialSpan = document.createElement('span');
                    initialSpan.className = 'initial-letter';
                    initialSpan.innerText = q.i.toUpperCase() + '...';
                    
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'fill-input';
                    input.id = `fill-${q.id}`;
                    input.placeholder = "Complete the word";
                    
                    fillWrapper.appendChild(initialSpan);
                    fillWrapper.appendChild(input);
                    qDiv.appendChild(fillWrapper);
                }

                // Placeholder for local question feedback
                const feedbackDiv = document.createElement('div');
                feedbackDiv.id = `feedback-${q.id}`;
                feedbackDiv.className = 'feedback-text';
                qDiv.appendChild(feedbackDiv);

                segDiv.appendChild(qDiv);
            });

            formContainer.appendChild(segDiv);
        });
    }

    function gradeQuiz() {
        let totalScore = 0;

        quizData.forEach(seg => {
            seg.questions.forEach(q => {
                const container = document.getElementById(`q-container-${q.id}`);
                const feedback = document.getElementById(`feedback-${q.id}`);
                let isCorrect = false;
                let userAns = "";

                if (q.type === 'mcq') {
                    const selected = document.querySelector(`input[name="question-${q.id}"]:checked`);
                    userAns = selected ? selected.value : "";
                    isCorrect = (userAns === q.a);
                } else if (q.type === 'fill') {
                    const inputElem = document.getElementById(`fill-${q.id}`);
                    userAns = inputElem.value.trim().toLowerCase();
                    
                    // Accept full word input regardless of whether student re-typed the initial letter or omitted it
                    let target = q.a.toLowerCase();
                    isCorrect = (userAns === target || userAns === target.substring(1));
                }

                if (isCorrect) {
                    totalScore++;
                    container.className = "question-container correct-answer";
                    feedback.innerHTML = "✓ Correct";
                    feedback.className = "feedback-text feedback-success";
                } else {
                    container.className = "question-container incorrect-answer";
                    const displayCorrect = q.type === 'mcq' ? q.a : q.a;
                    feedback.innerHTML = `✗ Incorrect. Correct answer: <strong>${displayCorrect}</strong>`;
                    feedback.className = "feedback-text feedback-error";
                }
            });
        });

        // Display dashboard results
        const resultsPanel = document.getElementById('results-panel');
        const scoreText = document.getElementById('score-text');
        const percentageText = document.getElementById('percentage-text');
        const summaryText = document.getElementById('feedback-summary');

        scoreText.innerText = `${totalScore} / 100`;
        const percentage = (totalScore / 100) * 100;
        percentageText.innerText = `Percentage Score: ${percentage}%`;

        if (percentage >= 85) {
            summaryText.innerText = "Excellent! You have demonstrated exceptional mastery of Units 21-30 vocabulary words.";
            summaryText.style.color = "var(--success-color)";
        } else if (percentage >= 60) {
            summaryText.innerText = "Good job! You passed, but review the highlighted incorrect items to solidify your knowledge base.";
            summaryText.style.color = "#dd6b20";
        } else {
            summaryText.innerText = "Needs Improvement. Please review the textbook exercises from Units 21-30 and retake the quiz.";
            summaryText.style.color = "var(--error-color)";
        }

        resultsPanel.style.display = 'block';
        window.scrollTo({ top: resultsPanel.offsetTop, behavior: 'smooth' });
    }

    // Initialize the quiz layout on window load
    window.onload = initQuiz;
</script>

</body>
</html>
